{% extends './base.html' %}
{% block title %} Update Informations{% endblock %}
{% block css %} <link rel="stylesheet" href="/static/css/delete_model.css"> {% endblock %}
{% block content %}
    {% include "./navbar.html" %}
    <main>
        <form method="post"  enctype="multipart/form-data">
            {% csrf_token %}
            <div class="model_body">
                <label class="profile_img" id="profile_image">
                    {% if user.profileImage %}
                    <img src="{{ user.profileImage.url }}" alt="">
                    {% else %}
                    <img src="/static/img/defualt_user.png" alt="">
                    {% endif %}
                    <input type="file" id="profileImage" name="profileImage" accept="image/*" onchange="previewImage(event)" hidden>
                </label>
                <div class="model_text">
                    <div class="model_text_title">
                        Update user <br>
                        <span style="font-size: 17px;">#click on item you want to edit</span>
                    </div>
                    <div class="model_text_message">
                        <div class="full_name_edit">
                            <input id="first_name" name="first_name" type="text" value="{{ user.first_name }}"><input id="last_name" name="last_name" type="text" value="{{ user.last_name }}">
                        </div>

                        @<input id="username" name="username" type="text" value="{{ user.username }}"><br>
                        <textarea id="userBio" name="userBio">{{ user.userBio }}</textarea>
                    </div>
                </div>
            </div>
            <div class="model_footer">
                <div class="model_actions">
                    <div class="cancel_delete" onclick="goBack()" >Cancel</div>
                    <button type="submit" class="confirm_delete">Confirm</button>
                </div>
            </div>
        </form>
    </main>
{% endblock %}
{% block script %}

<script>
    function previewImage(event) {
        var reader = new FileReader();
        reader.onload = function(){
            var output = document.getElementById('profile_image').getElementsByTagName('img')[0];
            output.src = reader.result;
        }
        reader.readAsDataURL(event.target.files[0]);
    }
</script>

{% endblock %}
