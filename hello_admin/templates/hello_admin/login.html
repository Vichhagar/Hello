<h2>Login</h2>
<form method="POST">
  {% csrf_token %}
  <div>
    <label for="username">Username:</label>
    <input type="text" id="username" name="username">
  </div>
  <div>
    <label for="password">Password:</label>
    <input type="password" id="password" name="password">
  </div>
  <div>
    <input type="submit" value="Login">
  </div>
</form>
