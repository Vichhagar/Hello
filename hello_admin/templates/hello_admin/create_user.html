{% extends './base.html' %}
{% block title %} Create user{% endblock %}
{% block css %} <link rel="stylesheet" href="/static/css/delete_model.css"> {% endblock %}
{% block content %}
    {% include "./navbar.html" %}
    <main>
      <form method="post">
        <div class="model_body">
            <div class="model_text" style="width: 100%;">
                <div class="model_text_title">
                    Create user..
                </div>
                <div class="model_text_message" style="margin-block: 1rem;">
                  <input id="username" name="username" type="text" placeholder="@username"
                  style="
                  font-weight: normal;
                  font-size: 17px;
                  border-bottom: 1px var(--dark) solid;
                  width: 100%;
                "
                onfocus="this.style.outline='none';"
                ><br>
                  <input id="email" name="email" type="email" placeholder="email" 
                    style="
                      font-weight: normal;
                      font-size: 16px;
                      border-bottom: 1px var(--dark) solid;
                      width: 100%;
                    "

                    onfocus="this.style.outline='none';"
                  ><br>
                  <input style="width: 100%;" name="password1" id="new_password_1" type="password" placeholder="Password"><br>
                  <input style="width: 100%;" name="password2" id="new_password_2" type="password" placeholder="Confirm Password">
                  <select name="userType" style="
                          width: 100%;
                          height: 30px;
                          font-size: 16px;
                          border: 1px var(--dark) solid;
                          margin-top: 10px;
                      ">
                      <option value="admin">admin</option>
                      <option value="moderator">moderator</option>
                      <option value="official">official</option>
                      <option value="normal">normal</option>
                    </select>
              </div>
            </div>
        </div>
        <div class="model_footer">
                {% csrf_token %}
                <div class="model_actions">
                    <div class="cancel_delete" onclick="goBack()" >Cancel</div>
                    <button type="submit" class="confirm_delete">Create</button>
                </div>

            </form>
        </div>
    </main>
{% endblock %}
