{% extends './base.html' %}
{% block title %} Change password{% endblock %}
{% block css %} <link rel="stylesheet" href="/static/css/delete_model.css"> {% endblock %}
{% block content %}
    {% include "./navbar.html" %}
    <main>
        <form method="post">
            {% csrf_token %}
            <div class="model_body">
                <div class="profile_img">
                    {% if request.user.profileImage %}
                    <img src="/images/{{ request.user.profileImage }}" alt="">
                    {% else %}
                    <img src="/static/img/defualt_user.png" alt="">
                    {% endif %}
                </div>
                <div class="model_text">
                    <div class="model_text_title">
                        Change Password <br>
                    </div>
                    <div class="model_text_message">
                        <input type="password" name="old_password" id="old_password" placeholder="Current Password">
                        <div class="new_password">
                            <input name="new_password1" id="new_password_1" type="password" placeholder="New Password"><input name="new_password2" id="new_password_2" type="password" placeholder="Confirm New Password">
                        </div>
                    </div>
                </div>
            </div>
            <div class="model_footer">
                <div class="model_actions">
                    <div class="cancel_delete" onclick="goBack()">Cancel</div>
                    <button type="submit" class="confirm_delete">Confirm</button>
                </div>
            </div>
        </form>
    </main>
{% endblock %}
