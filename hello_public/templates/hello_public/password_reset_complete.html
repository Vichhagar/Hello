{% extends './base.html' %}
{% block title %} Change password{% endblock %}
{% block css %} <link rel="stylesheet" href="/static/css/delete_model.css"> {% endblock %}
{% block content %}
    <main>
            <div class="model_body">
                <div class="profile_img">
                    <img src="/static/img/resetpassword.png" alt="">
                </div>
                <div class="model_text">
                    <div class="model_text_title">
                        Password Reset Complete <br>
                    </div>
                    <div class="model_text_message">
                        Your password has been successfully reset. You can now log in using your new password.
                    </div>
                </div>
            </div>
            <div class="model_footer">
                <div class="model_actions">
                    <a style="text-decoration: none;" href="{% url 'hello_public:login' %}" type="submit" class="confirm_delete">Login</a>
                </div>
            </div>
    </main>
{% endblock %}
