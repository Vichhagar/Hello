
{% extends './base.html' %}
{% block title %} Delete Post{% endblock %}
{% block css %} <link rel="stylesheet" href="/static/css/delete_model.css"> {% endblock %}
{% block content %}
    {% include "./navbar.html" %}
<main>
    <form method="post">
      <div class="model_body">
          <div class="model_text" style="width: 100%;">
              <div class="model_text_title">
                  Report post.
              </div>
              <div class="model_text_message">
                <textarea id="delete_message" name="Reason" placeholder="Reason..."></textarea>
              </div>
          </div>
      </div>
      <div class="model_footer">
              {% csrf_token %}
              <div class="model_actions">
                  <div class="cancel_delete" onclick="goBack()" >Cancel</div>
                  <button type="submit" class="confirm_delete">Report</button>
              </div>

          </form>
      </div>
  </main>
{% endblock %}
