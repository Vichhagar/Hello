{% extends './base.html' %}
{% block title %} Change password{% endblock %}
{% block css %} <link rel="stylesheet" href="/static/css/delete_model.css"> {% endblock %}
{% block content %}
    <main>
        <form method="post">
            {% csrf_token %}
            <div class="model_body">
                <div class="profile_img">
                    <img src="/static/img/resetpassword.png" alt="">
                </div>
                <div class="model_text">
                    <div class="model_text_title">
                        Set New Password <br>
                        <span style="font-size: 14px; line-height: 0px;"># 8+ characters, cannot be too similar to personal info, cannot be common, and cannot be entirely numeric.</span>
                    </div>
                    <div class="model_text_message">
                        <input type="password" name="new_password1" id="old_password" placeholder="New Password">
                        <input type="password" name="new_password2" id="old_password" placeholder="Confirm New Password">
                    </div>
                </div>
            </div>
            <div class="model_footer">
                <div class="model_actions">
                    <div class="cancel_delete" onclick="goBack()">Cancel</div>
                    <button type="submit" class="confirm_delete">Confirm</button>
                </div>
            </div>
        </form>
    </main>
{% endblock %}
